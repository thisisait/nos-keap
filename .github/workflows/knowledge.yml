name: knowledge

# Gates the canonical knowledge SoT (knowledge/canonical/**) on every push/PR:
#   - lint: schema + house-style (id/level, ext structure, en 20-2000, NO
#     Cyrillic in en/cs, id uniqueness, orphan ext parents)
#   - round-trip: ingest(canonical) → dump → diff == 0 (proves ingest.mjs and
#     dump.mjs are exact inverses, so canonical is a faithful, re-importable SoT)
# These run BEFORE the pazny.keap role ever applies knowledge to a live system.

on:
  push:
    # package-lock.json is a real input: the gate's npm ci fails on a lock
    # written for a different npm major (bitten once — v1.5.x era was all red).
    paths: ['knowledge/**', '.github/workflows/knowledge.yml', 'package-lock.json']
  pull_request:
    paths: ['knowledge/**', 'package-lock.json']
  workflow_dispatch:

jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Only libsql is needed for the knowledge tools; skip lifecycle scripts
      # (wxt prepare etc.) so the gate stays fast and independent of the app build.
      - run: npm ci --ignore-scripts
      # P-1: the 790-node seed spine is DATA (knowledge/spine/*.json) and
      # src/game/data/taxonomy.ts is generated from it. Same gate shape as the
      # brief cross-refs below — render and diff, so the checked-in artifact can
      # never drift from its source.
      - name: Seed spine in sync
        run: node knowledge/spine-render.mjs --check
      - name: Lint canonical knowledge
        run: node knowledge/lint.mjs
      # P-2: the artifact the nOS cortex port is graded against. Runs here as
      # well as in the unit suite so a fixture can never be edited into
      # agreement with a broken reference implementation.
      - name: onto1 composition conformance
        run: node knowledge/onto1-conformance.mjs
      - name: Round-trip identity (ingest → dump → diff == 0)
        run: node knowledge/roundtrip.mjs
      # roundtrip.mjs can only gate shapes the repo's own files contain, and the
      # ontology layer shipped with zero relations in it — so on its own it
      # would prove nothing about the relation format. This suite supplies the
      # data the repo lacks (every status, both sources, the rejection paths).
      # It lives here rather than in `app` because that workflow ignores
      # knowledge/**: a knowledge-only change would otherwise skip the one
      # suite written to gate it.
      # The trailing slash matters: a bare `knowledge` filter also matches
      # server/knowledge-lint.test.ts, and this job installs with
      # --ignore-scripts (no `wxt prepare`), so no .ts file in the repo can be
      # transformed here — the root tsconfig references an extension config that
      # extends the generated .wxt/tsconfig.json.
      - name: Ontology SoT round-trip (synthetic relations)
        run: npx vitest run knowledge/
      - name: Ingest dry-run
        run: node knowledge/ingest.mjs --dry-run --canonical knowledge/canonical
      - name: Brief cross-refs in sync
        run: node knowledge/lift-xrefs.mjs && git diff --exit-code knowledge/canonical
